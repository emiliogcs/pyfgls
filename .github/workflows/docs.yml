name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation and run notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,docs]"
      - name: Build the docs site (strict)
        run: mkdocs build --strict
      - name: Execute the example notebooks
        run: pytest --nbmake examples/ -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
